[package]
name = "zyrax"
version = "0.1.0"
description = "Cyberpunk overlay for upscaling (FSR/DLSS) and frame generation"
authors = ["1Nahuel1"]
edition = "2021"

[lib]
name = "zyrax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
sysinfo = "0.33"
dirs = "6"
tauri-plugin-global-shortcut = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
